<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caso 2 - Cajero Bancario Inteligente</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background-color: #eef2f7; }
        .contenedor { max-width: 550px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #1a5276; text-align: center; }
        .grupo-form { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input, button { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #2980b9; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #1f618d; }
        ul { list-style-type: none; padding: 0; margin-top: 15px; }
        li { background: #f8f9f9; border-left: 4px solid #2980b9; padding: 8px; margin-bottom: 5px; }
        li.retiro { border-left-color: #c0392b; }
        .resumen { margin-top: 20px; padding: 15px; background: #d4e6f1; border-radius: 5px; }
    </style>
</head>
<body>

<div class="contenedor">
    <h2>Cajero Bancario Inteligente</h2>

    <div class="grupo-form">
        <label for="selectOperacion">Seleccione la operación:</label>
        <select id="selectOperacion">
            <option value="Depósito">Depósito</option>
            <option value="Retiro">Retiro</option>
        </select>
    </div>

    <div class="grupo-form">
        <label for="inputMonto">Monto ($):</label>
        <input type="number" id="inputMonto" min="1" step="0.01" placeholder="Ej. 100">
    </div>

    <button onclick="procesarTransaccion()">Realizar Operación</button>

    <!-- Lista visual de movimientos -->
    <h4>Historial de Movimientos:</h4>
    <ul id="listaMovimientos">
        <li>No hay movimientos registrados aún.</li>
    </ul>

    <!-- Totales y saldo final -->
    <div class="resumen" id="panelResultados">
        <p><strong>Total depositado:</strong> $0.00</p>
        <p><strong>Total retirado:</strong> $0.00</p>
        <h3>Saldo final: $0.00</h3>
        <p><small>Promedio por transacción: $0.00</small></p>
    </div>
</div>

<!-- Enlace al archivo JavaScript -->
<script src="appx.js"></script>
</body>
</html>
